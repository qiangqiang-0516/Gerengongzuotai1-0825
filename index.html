<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>一人公司工作台 · 界面原型</title>
<style>
/* finesse · register=product · A=blue-gray business · B=400/700 · C=sidebar-shell
 * D=css-only · E=excel-clean · SOUL=6 SPECTACLE=2 DENSITY=7 */
:root{
  --bg:#eef1f6;
  --surface:#fbfcfe;
  --surface-2:#f3f6fb;
  --ink:#1f2733;
  --ink-soft:#5b6675;
  --muted:#8a93a3;
  --line:rgba(31,39,51,.09);
  --line-strong:rgba(31,39,51,.16);
  --accent:#2f6fed;
  --accent-soft:#e7effe;
  --accent-deep:#1e4fb0;
  --income:#1f9d6b;
  --expense:#e0494b;
  --receivable:#e0913a;
  --payable:#8a6fd1;
  --ok:#1f9d6b;
  --warn:#e0494b;
  --shadow:0 1px 2px rgba(31,39,51,.05),0 6px 20px rgba(31,39,51,.06);
  --radius:14px;
  --nav-w:218px;
  --tab-h:60px;
  --font:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:clip}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent-soft)}

.app{display:flex;min-height:100vh;min-height:100dvh}
.sidebar{width:var(--nav-w);flex:0 0 var(--nav-w);background:linear-gradient(180deg,#f7f9fc,#eef2f8);
  border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;height:100dvh;
  display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 16px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px;box-shadow:0 4px 10px rgba(47,111,237,.35)}
.brand .name{font-weight:700;font-size:15px;letter-spacing:.3px}
.brand .sub{font-size:11px;color:var(--muted)}
.nav-group{font-size:11px;color:var(--muted);padding:10px 12px 4px;letter-spacing:.5px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--ink-soft);font-weight:500;transition:.15s;position:relative}
.nav-item .ico{width:20px;height:20px;flex:0 0 20px;opacity:.85}
.nav-item .badge{margin-left:auto;background:var(--expense);color:#fff;font-size:10px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.nav-item:hover{background:rgba(47,111,237,.06);color:var(--ink)}
.nav-item.active{background:var(--accent-soft);color:var(--accent-deep);font-weight:700}
.nav-item.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--accent)}
.side-foot{margin-top:auto;font-size:11px;color:var(--muted);padding:10px 12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(31,157,107,.18)}

.content{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:56px;display:flex;align-items:center;gap:12px;padding:0 22px;border-bottom:1px solid var(--line);background:rgba(251,252,254,.8);backdrop-filter:blur(6px);position:sticky;top:0;z-index:20}
.topbar .page-title{font-weight:700;font-size:16px}
.topbar .crumb{font-size:12px;color:var(--muted)}
.topbar .spacer{flex:1}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent-deep);font-weight:700;font-size:13px}
.scroll{padding:20px 22px 40px;max-width:1180px;width:100%;margin:0 auto}
.tabbar{display:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
.card h3{font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:12px;display:flex;align-items:center;gap:8px;letter-spacing:.3px}
.card h3 .hint{font-weight:400;color:var(--muted);font-size:11px;margin-left:auto}
.row{display:flex;gap:14px;flex-wrap:wrap}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grid-5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.mt{margin-top:14px}.mt-s{margin-top:8px}.mb{margin-bottom:14px}
.section-title{font-size:14px;font-weight:700;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.section-title .bar{width:4px;height:15px;border-radius:3px;background:var(--accent)}

.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.qbtn{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:9px;box-shadow:var(--shadow);transition:.15s}
.qbtn:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 8px 22px rgba(47,111,237,.14)}
.qbtn .qi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:20px}
.qbtn .ql{font-size:13px;font-weight:600;color:var(--ink)}

.hook{background:linear-gradient(120deg,#1e2c44,#2f6fed);border-radius:var(--radius);padding:16px 18px;color:#eaf1ff;box-shadow:var(--shadow);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hook .chip{display:flex;flex-direction:column;padding:2px 16px;border-right:1px solid rgba(255,255,255,.14)}
.hook .chip:last-child{border-right:none}
.hook .chip .v{font-size:19px;font-weight:700;letter-spacing:.3px}
.hook .chip .v small{font-size:12px;font-weight:500;opacity:.85}
.hook .chip .k{font-size:11px;opacity:.8;margin-top:2px}
.hook .chip.alert .v{color:#ffd479}
.hook .chip.alert .v::after{content:" ⚠";font-size:12px}

.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 15px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.tile .k{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.tile .v{font-size:22px;font-weight:700;margin-top:6px;letter-spacing:.3px}
.tile .v .u{font-size:13px;font-weight:500;color:var(--ink-soft);margin-right:1px}
.tile .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.tile.inc .v{color:var(--income)} .tile.exp .v{color:var(--expense)}
.tile.rec .v{color:var(--receivable)} .tile.pay .v{color:var(--payable)}
.tile .sub{font-size:11px;color:var(--muted);margin-top:3px}

.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 14px;border-radius:8px;font-size:13px;color:var(--ink-soft);font-weight:600}
.seg button.on{background:var(--surface);color:var(--accent-deep);box-shadow:var(--shadow)}

.list{display:flex;flex-direction:column}
.litem{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}
.litem:last-child{border-bottom:none}
.litem .lmain{flex:1;min-width:0}
.litem .lt{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.litem .ls{font-size:11px;color:var(--muted);margin-top:2px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line)}
.tag.normal{background:#eef3ee;color:var(--income);border-color:#d6e8dc}
.tag.rec{background:#fbf0df;color:var(--receivable);border-color:#f0dcb8}
.tag.pay{background:#efeafb;color:var(--payable);border-color:#dcd2f2}
.tag.defer{background:#fde9e9;color:var(--expense);border-color:#f3cccc}
.tag.proj{background:var(--accent-soft);color:var(--accent-deep);border-color:#cfe0fd}
.tag.link{background:#eef3fb;color:#3a6fd0;border-color:#d3e0f6}
.amount{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.amount.inc{color:var(--income)} .amount.exp{color:var(--expense)}
.mini-btn{font-size:12px;font-weight:600;color:var(--accent);padding:5px 10px;border-radius:8px;background:var(--accent-soft)}
.mini-btn:hover{background:#d8e6fe}
.clickable{color:var(--accent-deep);font-weight:700;cursor:pointer}
.clickable:hover{text-decoration:underline}

.milk-sum{font-size:30px;font-weight:800;color:var(--accent)}
.milk-sum small{font-size:14px;color:var(--muted);font-weight:500;margin-left:4px}

.barchart{display:flex;align-items:flex-end;gap:8px;height:160px;padding:8px 2px 0}
.barchart .bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.barchart .barwrap{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.barchart .bar{width:min(70%,34px);border-radius:6px 6px 0 0;background:linear-gradient(180deg,#5b8ff7,#2f6fed);position:relative;transition:height .6s cubic-bezier(.2,.7,.3,1)}
.barchart .bar small{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--ink-soft);white-space:nowrap}
.barchart .xlab{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* donut */
.donut{width:120px;height:120px;border-radius:50%;position:relative;flex:0 0 120px}
.donut .hole{position:absolute;inset:30px;background:var(--surface);border-radius:50%;display:grid;place-items:center;text-align:center}
.donut .hole .hv{font-size:15px;font-weight:700}
.donut .hole .hl{font-size:10px;color:var(--muted)}
.donut-wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donut-legend{flex:1;min-width:170px}
.donut-legend .dl{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12px}
.donut-legend .dl .sw{width:10px;height:10px;border-radius:3px;flex:0 0 10px}
.donut-legend .dl .nm{flex:1;color:var(--ink-soft)}
.donut-legend .dl .am{font-weight:700}
.donut-legend .dl .pc{color:var(--muted);width:46px;text-align:right;font-variant-numeric:tabular-nums}

.proj-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.proj-col{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px}
.proj-col .col-h{font-weight:700;font-size:12px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.proj-card{border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--surface);box-shadow:var(--shadow);margin-bottom:10px;transition:.15s}
.proj-card:hover{border-color:var(--accent)}
.proj-card .pn{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.status-pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px}
.st-plan{background:#eef3fb;color:#3a6fd0} .st-doing{background:#e9f7ef;color:var(--income)} .st-done{background:#f1f1f3;color:var(--muted)}
.proj-card .stats{display:flex;gap:14px;margin-top:8px}
.proj-card .stats div .n{font-size:15px;font-weight:700}
.proj-card .stats div .l{font-size:11px;color:var(--muted)}

.order-card{border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:var(--surface);box-shadow:var(--shadow);margin-bottom:10px}
.order-card .ot{font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px}
.order-card .om{font-size:11px;color:var(--muted);margin-top:3px}

/* project finance table */
.pf-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.pf-tbl th{text-align:right;font-size:11px;color:var(--muted);font-weight:600;padding:9px 8px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
.pf-tbl th:first-child{text-align:left}
.pf-tbl td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.pf-tbl td:first-child{text-align:left}
.pf-tbl tr:hover td{background:var(--surface-2)}
.pf-tbl .pn{font-weight:700;font-size:13px}
.pf-tbl .pos{color:var(--income)} .pf-tbl .neg{color:var(--expense)}
.pf-cell{display:inline-block;min-width:64px}

.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.num-r{text-align:right}
.cat-tbl .pct{color:var(--muted);font-variant-numeric:tabular-nums}
.tbl.acct-tbl.compact th{padding:5px 6px;font-size:11px}
.tbl.acct-tbl.compact td{padding:6px 7px;font-size:12px}
.tbl tr:hover td{background:var(--surface-2)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--ink-soft);background:var(--surface-2);padding:1px 6px;border-radius:5px}

.param-group{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.param-group .pg-head{display:flex;align-items:center;padding:11px 14px;background:var(--surface-2);font-weight:700;font-size:13px;cursor:pointer;user-select:none}
.param-group .pg-head .caret{margin-left:auto;transition:.2s;color:var(--muted)}
.param-group.open .pg-head .caret{transform:rotate(90deg)}
.param-group .pg-body{padding:6px 14px;display:none}
.param-group.open .pg-body{display:block}
.pg-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.pg-row:last-child{border-bottom:none}
.pg-row .pt{font-weight:500}
.pg-row .pd{margin-left:auto;display:flex;gap:8px}
.iconbtn{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--ink-soft);background:var(--surface-2)}
.iconbtn:hover{background:var(--accent-soft);color:var(--accent)}

.overlay{position:fixed;inset:0;background:rgba(20,28,40,.42);backdrop-filter:blur(2px);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.overlay.show{display:flex}
.modal{background:var(--surface);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:20px 20px 26px;box-shadow:0 -10px 40px rgba(0,0,0,.2);max-height:92vh;overflow:auto}
@media(min-width:560px){.overlay{align-items:center}.modal{border-radius:18px}}
.modal h2{font-size:17px;font-weight:700;margin-bottom:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--ink-soft);font-weight:600;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line-strong);border-radius:10px;font-family:inherit;font-size:14px;background:var(--surface);color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field .ro{background:var(--surface-2);padding:10px 12px;border-radius:10px;font-size:13px;color:var(--ink-soft)}
.field .est{margin-top:6px;font-size:12px;font-weight:700;color:var(--accent-deep)}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{flex:1;min-width:64px;text-align:center;padding:9px;border:1px solid var(--line-strong);border-radius:10px;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer}
.radios input{display:none}
.radios label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent-deep)}
.btn{padding:11px 18px;border-radius:11px;font-weight:700;font-size:14px;transition:.15s}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(47,111,237,.3)}
.btn-primary:hover{background:var(--accent-deep)}
.btn-ghost{background:var(--surface-2);color:var(--ink-soft)}
.btn-ghost:hover{background:#e7ebf2}
.btn-row{display:flex;gap:10px;margin-top:6px}
.btn-row .btn{flex:1}
.transfer-fields{display:none;gap:10px;margin-bottom:14px}
.transfer-fields.show{display:flex}

.oi-h{font-size:11px;color:var(--muted);font-weight:600}
.todo-topseg{display:flex;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;margin-bottom:14px}
.todo-topseg button{flex:1;padding:11px 0;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink-soft);text-align:center}
.todo-topseg button.on{background:var(--surface);color:var(--accent-deep);box-shadow:var(--shadow)}

.prod-cell{white-space:normal;line-height:1.45;vertical-align:top;max-width:220px;min-width:180px}
.prod-line{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:baseline;padding:3px 0;border-bottom:1px dashed var(--line)}
.prod-line:last-child{border-bottom:none}
.pn-q{font-weight:600;color:var(--ink)}
.pn-x{color:var(--muted);font-size:11px}
.pn-d{color:var(--receivable);font-size:11px;font-weight:600}
.pn-amount{font-weight:700;color:var(--accent-deep);white-space:nowrap;font-size:12px}
.proj-cell{white-space:normal;line-height:1.5;vertical-align:top;max-width:220px;min-width:160px}
.proj-cell .proj-line{display:block;padding:2px 0}
.op-col{text-align:right;white-space:nowrap}
.op-col .iconbtn{margin-left:4px}
.proj-auto{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0;min-height:24px}

.diary-top{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.grid-4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qcard{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:92px}
.qcard .qh{font-size:13px;font-weight:700;color:var(--accent-deep);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.qcard .qi{font-size:12px;color:var(--ink-soft);line-height:1.6;padding-left:2px}
.qcard .qempty{font-size:12px;color:var(--muted)}
.dsearch-box{margin-bottom:14px}

.todo-tabs{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;margin-bottom:6px}
.todo-tabs button{padding:6px 16px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-soft)}
.todo-tabs button.on{background:var(--surface);color:var(--accent-deep);box-shadow:var(--shadow)}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.empty{padding:30px 10px;text-align:center;color:var(--muted);font-size:13px}
.empty .eb{font-size:30px;margin-bottom:8px;opacity:.5}

/* todo 3-column layout */
.todo-layout{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:14px;align-items:start}
.todo-quick{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.todo-quick input[type=text]{flex:1;min-width:160px}
.todo-quick input[type=date]{width:140px}
.todo-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.todo-stats .s{background:var(--surface-2);border-radius:10px;padding:10px;text-align:center}
.todo-stats .s .n{font-size:20px;font-weight:800}
.todo-stats .s .l{font-size:11px;color:var(--muted);margin-top:2px}
.timeline-item{display:flex;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.timeline-item .tm{font-size:11px;color:var(--muted);font-weight:700;width:46px;flex:0 0 46px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-grid .wd{font-size:11px;color:var(--muted);text-align:center;padding:4px 0;font-weight:600}
.cal-cell{border:1px solid var(--line);border-radius:8px;min-height:74px;padding:4px;background:var(--surface);font-size:10px}
.cal-cell.empty{background:transparent;border:none}
.cal-cell.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.cal-cell .cd{font-weight:700;font-size:11px;color:var(--ink-soft);margin-bottom:3px}
.cal-dot{background:var(--accent-soft);color:var(--accent-deep);border-radius:5px;padding:2px 4px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ============== Helpers ============== */
const $=(s,r=document)=>r.querySelector(s);
const fmt=n=>"¥"+Math.round(n).toLocaleString("zh-CN");
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1800);}
function esc(s){return (s??"").toString().replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function projName(code){if(!code)return "—";return code.split(",").map(c=>{const p=M.projects.find(x=>x.code===c);return p?p.name:c;}).join("、");}
function projShort(code){const p=M.projects.find(x=>x.code===code);return p?`${p.name}(${p.code})`:"—";}
function daysBetween(a,b){return Math.round((b-a)/86400000);}
function deferDays(t){if(t.done)return 0;const c=new Date(t.created);return Math.max(0,daysBetween(c,TODAY));}

/* ============== Charts ============== */
function barChart(data,opts={}){
  const max=Math.max(1,...data.map(d=>d.v));
  return `<div class="barchart">${data.map(d=>`<div class="bc"><div class="barwrap"><div class="bar" data-h="${(d.v/max*100)}" style="height:0;background:${d.color||'linear-gradient(180deg,#5b8ff7,#2f6fed)'}">${opts.showVal?`<small>${typeof d.v==='number'&&Math.abs(d.v)>=1000?fmt(d.v):d.v}</small>`:""}</div></div><div class="xlab">${esc(d.x)}</div></div>`).join("")}</div>`;
}
function donut(segments,center){
  const total=Math.max(1,segments.reduce((s,x)=>s+x.v,0));
  let acc=0,conic="";
  segments.forEach(s=>{const start=acc/total*360;acc+=s.v;const end=acc/total*360;conic+=`${s.color} ${start}deg ${end}deg,`;});
  const legend=segments.map(s=>{const pct=Math.round(s.v/total*100);return `<div class="dl"><span class="sw" style="background:${s.color}"></span><span class="nm">${esc(s.name||"")}</span><span class="am">${fmt(s.v)}</span><span class="pc">${pct}%</span></div>`;}).join("");
  return `<div class="donut-wrap"><div class="donut" style="background:conic-gradient(${conic.slice(0,-1)})"><div class="hole"><div><div class="hv">${center.v}</div><div class="hl">${center.l}</div></div></div></div><div class="donut-legend">${legend}</div></div>`;
}
function animateBars(root){root.querySelectorAll(".bar").forEach((b,i)=>{const h=b.getAttribute("data-h");setTimeout(()=>b.style.height=h+"%",40+i*40);});}

/* ============== Date range filter ============== */
function inRange(dateStr,range){
  const d=new Date(dateStr);
  if(range==="本月")return d.getFullYear()===TODAY.getFullYear()&&d.getMonth()===TODAY.getMonth();
  if(range==="本年")return d.getFullYear()===TODAY.getFullYear();
  if(range==="本季"){const q=Math.floor(TODAY.getMonth()/3);return d.getFullYear()===TODAY.getFullYear()&&Math.floor(d.getMonth()/3)===q;}
  if(range==="本周"){const from=new Date(TODAY);from.setDate(TODAY.getDate()-6);return d>=from;}
  return true;
}
function inPeriod(dateStr,p){
  const dt=new Date(dateStr);
  if(p==="日")return dt.getFullYear()===TODAY.getFullYear()&&dt.getMonth()===TODAY.getMonth()&&dt.getDate()===TODAY.getDate();
  if(p==="周"){const from=new Date(TODAY);from.setDate(TODAY.getDate()-6);return dt>=from;}
  if(p==="月")return dt.getFullYear()===TODAY.getFullYear()&&dt.getMonth()===TODAY.getMonth();
  if(p==="季"){const q=Math.floor(TODAY.getMonth()/3);return dt.getFullYear()===TODAY.getFullYear()&&Math.floor(dt.getMonth()/3)===q;}
  if(p==="年")return dt.getFullYear()===TODAY.getFullYear();
  return true;
}
function accountInc(code){return M.txns.filter(t=>t.from===code&&t.type==="收入"&&t.tag==="正常"&&inRange(t.date,moneyFilter)).reduce((s,t)=>s+t.amount,0);}
function accountExp(code){return M.txns.filter(t=>t.from===code&&t.type==="支出"&&t.tag==="正常"&&inRange(t.date,moneyFilter)).reduce((s,t)=>s+t.amount,0);}
function setAccountOpening(code,val){const a=M.accounts.find(x=>x.code===code);if(!a)return;a.opening=parseFloat(val)||0;const inc=accountInc(code),exp=accountExp(code),end=a.opening+inc-exp;const e=document.getElementById("end-"+code);if(e)e.textContent=fmt(end);refreshAccountTotals();}
function refreshAccountTotals(){let to=0,ti=0,te=0;M.accounts.forEach(a=>{to+=a.opening;ti+=accountInc(a.code);te+=accountExp(a.code);});const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};set("tot-open",fmt(to));set("tot-inc","+"+fmt(ti));set("tot-exp","-"+fmt(te));set("tot-end",fmt(to+ti-te));}
function catCard(type,title){
  const f=M.txns.filter(t=>inRange(t.date,moneyFilter)&&t.type===type&&t.tag==="正常");
  const map={};f.forEach(t=>{map[t.category]=(map[t.category]||0)+t.amount;});
  const arr=Object.keys(map).map(c=>({c,v:map[c]})).sort((a,b)=>b.v-a.v);
  const total=arr.reduce((s,x)=>s+x.v,0);
  const rows=arr.length?arr.map(({c,v})=>`<tr><td>${esc(c)}</td><td class="num-r ${type==='收入'?'pos':'neg'}">${type==='收入'?'+':'-'}${fmt(v)}</td><td class="num-r pct">${total?Math.round(v/total*100):0}%</td></tr>`).join(""):'<tr><td colspan="3"><div class="empty">该周期暂无'+type+'流水</div></td></tr>';
  return `<div class="card"><h3>${title} <span class="hint">${moneyFilter} · 按金额降序 · 占比=占${type}总额</span></h3>
      <div style="overflow-x:auto"><table class="tbl cat-tbl">

        </tbody></table></div></div>`;
}

/* ============== diary helpers ============== */
function diaryTitleFromRaw(raw){
  if(!raw)return "未命名";
  const s=raw.replace(/今天|今日|昨天|明天|上午|下午|晚上|早上/g,"").replace(/\s+/g," ").trim();
  if(!s)return "未命名";
  return s.length>18?s.slice(0,18)+"…":s;
}
function setDiarySel(v){
  if(v==="__new__"){
    const d=new Date();const code="R"+d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
    M.diaries.unshift({code,date:"2026-08-24",title:"",raw:"",summary:{今日小事:[],收获新知:[],感恩时刻:[],优化改进:[]}});
    diarySel=code;render();return;
  }
  diarySel=v;render();
}
function saveDiaryEntry(){
  const e=M.diaries.find(x=>x.code===diarySel);if(!e)return;
  e.raw=$("#dRaw").value;
  e.title=diaryTitleFromRaw(e.raw);
  toast("已保存日记 · 标题已根据内容自动提炼");
}
function setDiarySearch(v){
  diarySearch=v;
  clearTimeout(window._dSrchT);
  window._dSrchT=setTimeout(()=>{
    const kw=(diarySearch||"").trim();
    const matched=kw?M.diaries.filter(d=>(d.raw||"").includes(kw)||JSON.stringify(d.summary||{}).includes(kw)):[];
    const box=$("#dSearchResults");
    if(!box)return;
    if(!kw){box.outerHTML=`<div id="dSearchResults"></div>`;return;}
    box.innerHTML=`<div class="card mb"><h3>搜索结果 <span class="hint">${matched.length} 篇含「${esc(kw)}」</span></h3>${matched.length?matched.map(d=>{const hit=(d.raw||"").split(/[。！？\n]/).find(s=>s.includes(kw))||"";return `<div class="litem"><div class="lmain"><div class="lt">${d.date} · ${esc(d.title||'未命名')}</div><div class="ls">…${esc(hit)}…</div></div><button class="mini-btn" onclick="diarySel='${d.code}';diarySearch='';render()">查看</button></div>`;}).join(""):'<div class="empty">无匹配日记</div>'}</div>`;
  },180);
}
function aiSummarizeDiary(code){
  const e=M.diaries.find(x=>x.code===code);if(!e)return;
  const sum={今日小事:[],收获新知:[],感恩时刻:[],优化改进:[]};
  const sentences=(e.raw||"").split(/[。！？\n]/).map(s=>s.trim()).filter(Boolean);
  sentences.forEach(s=>{
    if(/收获|学到|思路|认识|方法|启发|了解/.test(s))sum.收获新知.push(s);
    else if(/感恩|感谢|谢谢|帮|支持/.test(s))sum.感恩时刻.push(s);
    else if(/优化|改进|可以|后续|明天|再|提前|调整/.test(s))sum.优化改进.push(s);
    else sum.今日小事.push(s);
  });
  e.summary=sum;toast("AI 已提炼四类（v1 关键词占位，真实模型待接）");render();
}
function diaryArchive(){
  const groups={};M.diaries.forEach(d=>{const m=d.date.slice(0,7);(groups[m]=groups[m]||[]).push(d);});
  const months=Object.keys(groups).sort().reverse();
  if(!months.length)return '<div class="empty">暂无日记</div>';
  return months.map(m=>{const items=groups[m].slice().reverse();
    return `<div class="param-group open"><div class="pg-head" onclick="this.parentElement.classList.toggle('open')">📅 ${m}<span style="margin-left:8px;color:var(--muted);font-weight:500;font-size:11px">${items.length} 篇</span><span class="caret">›</span></div>
      <div class="pg-body">${items.map(d=>{const cnt=Object.values(d.summary||{}).reduce((s,a)=>s+(a?a.length:0),0);
        return `<div class="litem"><div class="lmain"><div class="lt">${d.date} · ${esc(d.title||'未命名')}</div><div class="ls"><span class="code">${d.code}</span> · ${cnt} 条提炼</div></div>
          <div class="pd"><button class="mini-btn" onclick="diarySel='${d.code}';render()">查看/编辑</button></div></div>`;}).join("")}</div></div>`;
  }).join("");
}

/* ============== todo list ============== */
function todoList(list,showDefer){
  if(!list.length)return '<div class="empty"><div class="eb">✅</div>无事项</div>';
  return `<div class="list">${list.map(t=>{const dd=deferDays(t);const cont=t.repeat&&t.repeat!=="无"&&dd>0;return `<div class="litem">
    <button class="iconbtn" onclick="toggleTodo('${t.code}')" style="${t.done?'background:var(--ok);color:#fff':''}">${t.done?'✓':'○'}</button>
    <div class="lmain"><div class="lt" style="${t.done?'text-decoration:line-through;color:var(--muted)':''}">${esc(t.title)}</div>
      <div class="ls"><span class="code">${t.code}</span> · 提醒 ${t.remind} · ${t.repeat} · 预计 ${t.due||'—'}${showDefer&&dd>0?` · <span class="tag defer">已顺延 ${dd} 天</span>`:''}${cont?` · <span class="tag defer">连续 ${dd} 天未完成</span>`:''}</div></div>
  </div>`;}).join("")}</div>`;
}
function setTodoView(view,el){
  document.querySelectorAll(".todo-tabs button").forEach(b=>b.classList.remove("on"));el.classList.add("on");
  const list=view==="done"?M.todos.filter(t=>t.done):view==="open"?M.todos.filter(t=>!t.done):M.todos;
  $("#todoView").innerHTML=todoList(list,true);
}
function quickAddTodo(){
  const title=$("#qTitle").value.trim();const date=$("#qDate").value||"2026-08-24";
  if(!title){toast("请输入待办内容");return;}
  M.todos.push({code:"TD"+String(M.todos.length+1).padStart(4,"0"),title,remind:"—",repeat:"无",done:false,created:"2026-08-24",due:date});
  $("#qTitle").value="";toast("已添加待办");render();updateTodoBadge();
}
function todoCalendar(){
  const y=2026,m=7;const first=new Date(y,m,1).getDay();const lead=(first+6)%7;
  const days=new Date(y,m+1,0).getDate();
  let cells="";const wd=["一","二","三","四","五","六","日"];
  cells+=wd.map(d=>`<div class="wd">${d}</div>`).join("");
  for(let i=0;i<lead;i++)cells+='<div class="cal-cell empty"></div>';
  for(let d=1;d<=days;d++){
    const ds=`2026-08-${String(d).padStart(2,"0")}`;
    const list=M.todos.filter(t=>t.due===ds);
    const isToday=ds==="2026-08-24";
    cells+=`<div class="cal-cell ${isToday?'today':''}"><div class="cd">${d}</div>${list.map(t=>`<div class="cal-dot ${t.done?'done':''}">${esc(t.title.length>6?t.title.slice(0,6)+'…':t.title)}</div>`).join("")}</div>`;
  }
  return `<div class="cal-grid">${cells}</div>`;
}

        <button class="iconbtn" onclick="toggleTodo('${t.code}')" style="${t.done?'background:var(--ok);color:#fff':''}">${t.done?'✓':'○'}</button>

/* ============== period ============== */
function periodTiles(p){
  const f=M.txns.filter(t=>inPeriod(t.date,p));
  const inc=f.filter(t=>t.type==="收入"&&t.tag==="正常").reduce((s,t)=>s+t.amount,0);
  const exp=f.filter(t=>t.type==="支出"&&t.tag==="正常").reduce((s,t)=>s+t.amount,0);
  const rec=f.filter(t=>t.tag==="应收").reduce((s,t)=>s+t.amount,0);
  const pay=f.filter(t=>t.tag==="应付").reduce((s,t)=>s+t.amount,0);
  const avail=M.accounts.reduce((s,a)=>s+a.balance,0);
  const data={收入:inc,支出:exp,可用:avail,应收:rec,应付:pay};
  const tiles=[["收入","inc",data.收入],["支出","exp",data.支出],["可用资金","",data.可用],["应收","rec",data.应收],["应付","pay",data.应付]];
  return tiles.map(([k,c,v])=>`<div class="tile ${c}"><div class="k">${k}</div><div class="v">${fmt(v)}</div></div>`).join("");
}
function periodSeries(p){
  const ds=dt=>dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
  const y=TODAY.getFullYear(),mo=TODAY.getMonth(),d=TODAY.getDate(),q=Math.floor(mo/3);
  const netDay=dt=>{const s=ds(dt);return M.txns.filter(t=>t.date===s&&t.tag==="正常").reduce((s,t)=>s+(t.type==="收入"?t.amount:-t.amount),0);};
  const netMon=(yy,mm)=>{const pre=yy+"-"+String(mm+1).padStart(2,"0");return M.txns.filter(t=>t.date.startsWith(pre)&&t.tag==="正常").reduce((s,t)=>s+(t.type==="收入"?t.amount:-t.amount),0);};
  if(p==="日")return [{x:"今天",v:netDay(TODAY)}];
  if(p==="周"){const a=[];for(let i=6;i>=0;i--){const dt=new Date(TODAY);dt.setDate(d-i);a.push({x:String(dt.getDate()),v:netDay(dt)});}return a;}
  if(p==="月"){const a=[];for(let i=1;i<=d;i++)a.push({x:String(i),v:netDay(new Date(y,mo,i))});return a;}
  if(p==="季"){const a=[];for(let mm=q*3;mm<q*3+3;mm++)a.push({x:(mm+1)+"月",v:netMon(y,mm)});return a;}
  if(p==="年"){const a=[];for(let mm=0;mm<12;mm++)a.push({x:(mm+1)+"月",v:netMon(y,mm)});return a;}
  return [];
}

  document.querySelectorAll("#periodSeg button").forEach(b=>b.classList.remove("on"));el.classList.add("on");
  $("#periodTiles").innerHTML=periodTiles(p);

  animateBars($("#periodChart"));
}

  promptModal("编辑「"+cat+"」项",arr[i],(v)=>{arr[i]=v;toast("已更新");if(location.hash==="#/settings")render();});
}
function delParam(cat,i){
  const arr=M.params[cat];if(!arr||!arr[i])return;
  const val=arr[i];
  confirmModal("删除「"+cat+"」项",`确认删除：${val}？\n若该项已被交易/账户引用，相关记录将仅保留原文本、不再关联到该选项。`,()=>{arr.splice(i,1);toast("已删除："+val);if(location.hash==="#/settings")render();});
}
function addParam(cat){
  promptModal("新增「"+cat+"」项","",(v)=>{M.params[cat].push(v);toast("已新增："+v);if(location.hash==="#/settings")render();},"输入名称");
}
function render(){
  const r=location.hash||"#/home";
  if(!screens[r])location.hash="#/home";
  $("#view").innerHTML=screens[r]?screens[r]():"";
  $("#pageTitle").textContent=TITLES[r]||"首页";
  document.querySelectorAll("[data-route]").forEach(a=>a.classList.toggle("active",a.getAttribute("data-route")===r));
  if(r==="#/home"){const c=$("#periodChart");if(c)animateBars(c);}
  if(r==="#/diary"&&diarySearch){setDiarySearch(diarySearch);}
  window.scrollTo(0,0);
}
function go(h){location.hash=h;}
window.addEventListener("hashchange",render);

function openTxn(opts={}){
  _txnProjAll="";
  _editingTxnCode=opts.editCode||null;
  $("#modal").innerHTML=`
    <h2>${opts.fromReceived?'登记回款':'记一笔'}${opts.fromReceived?'<span style="font-size:12px;color:var(--muted);font-weight:400;margin-left:8px">选择订单后自动带出项目/客户</span>':''}</h2>
    <div class="field"><label>类型</label><div class="radios" id="txType">${["支出","收入","转账"].map((t,i)=>`<label><input type="radio" name="tt" value="${t}" ${(opts.defaultType===t)||(!opts.defaultType&&i===0)?'checked':''}><span>${t}</span></label>`).join("")}</div></div>
    <div class="field"><label>金额</label><input id="txAmt" type="number" placeholder="0.00" inputmode="decimal"></div>
    <div class="field" id="catField"><label>分类</label><select id="txCat"></select></div>
    <div class="field"><label>账户</label><select id="txAcc">${M.accounts.map(a=>`<option value="${a.code}">${a.name}</option>`).join("")}</select></div>
    <div class="transfer-fields" id="txTransfer"><div class="field" style="flex:1"><label>转入账户</label><select id="txTo">${M.accounts.map(a=>`<option value="${a.code}">${a.name}</option>`).join("")}</select></div></div>
    <div class="field"><label>关联项目（可选；选择订单后自动带出该订单全部关联项目）</label>
      <select id="txProj"><option value="">不挂钩</option>${M.projects.map(p=>`<option value="${p.code}">${p.name}</option>`).join("")}</select>
      <div id="txProjTags" class="proj-auto" style="display:none"></div></div>
    <div class="field"><label>关联订单（回款登记专用；选客户后仅列出该客户名下「未款齐」订单，选择后自动带出客户/项目）</label><select id="txOrder"><option value="">不挂钩</option></select></div>
    <div class="field"><label>关联客户（自动从订单带出，可手动改）</label><select id="txCust"><option value="">不挂钩</option>${M.customers.map(c=>`<option value="${c.code}">${c.name}</option>`).join("")}</select></div>
    <div class="field"><label>标签（默认正常，手动改应收/应付）</label><div class="radios" id="txTag">${["正常","应收","应付"].map((t,i)=>`<label><input type="radio" name="tg" value="${t}" ${(opts.defaultTag===t)||(!opts.defaultTag&&i===0)?'checked':''}><span>${t}</span></label>`).join("")}</div></div>
    <div class="field"><label>摘要</label><input id="txNote" placeholder="可选"></div>
    <div class="btn-row"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveTxn()">保存</button></div>`;
  const updProjFromOrder=()=>{
    const code=$("#txOrder").value;
    const sel=$("#txProj"),tags=$("#txProjTags");
    if(!code){sel.style.display="";tags.style.display="none";_txnProjAll="";return;}
    const o=M.orders.find(x=>x.code===code);if(!o)return;
    // 自动带出客户并联动订单下拉
      if(o.customer){const cEl=$("#txCust");if(cEl)cEl.value=o.customer;renderTxnOrderOptions();}
      // 自动带出该订单全部关联项目（逗号分隔），确保各项目收支均能取到
      if(o.project){
        _txnProjAll=o.project;
        sel.style.display="none";tags.style.display="flex";
        tags.innerHTML=o.project.split(",").filter(Boolean).map(cc=>`<span class="tag proj">📎 ${projName(cc)}</span>`).join("")+`<span class="ls" style="font-size:11px;color:var(--muted)">（回款计入全部关联项目）</span>`;
      }else{_txnProjAll="";sel.style.display="";tags.style.display="none";}
    };
    // 物理重建订单下拉：仅保留「该客户名下 + 未款齐」的订单（禁用项仍会出现在原生下拉里，故改为重建）
    const renderTxnOrderOptions=()=>{
      const oEl=$("#txOrder");if(!oEl)return;
      const cust=$("#txCust").value;
      const list=M.orders.filter(o=>{
        const due=Math.max(0,o.amount-(o.received||0));
        if(due<=0)return false;
        if(cust&&o.customer!==cust)return false;
        return true;
      });
      const cur=oEl.value;
      oEl.innerHTML=`<option value="">不挂钩</option>`+list.map(o=>{const c=M.customers.find(x=>x.code===o.customer);const due=Math.max(0,o.amount-(o.received||0));return `<option value="${o.code}">${o.code} · ${c?c.name:'?'} · ${fmt(o.received||0)}/${fmt(o.amount)}${due>0?' · 待 '+fmt(due):''}</option>`;}).join("");
      if(cur&&list.some(o=>o.code===cur))oEl.value=cur;else if(cur)oEl.value="";
    };
    $("#txType").addEventListener("change",e=>{const t=e.target.value,isT=t==="转账";$("#catField").style.display=isT?"none":"block";$("#txTransfer").classList.toggle("show",isT);renderTxnCatOptions(t);});
    $("#txOrder").addEventListener("change",updProjFromOrder);
    $("#txCust").addEventListener("change",renderTxnOrderOptions);
    if(_editingTxnCode){
      const t=M.txns.find(x=>x.code===_editingTxnCode);
      if(t){
        const isTransfer=t.category==="转账";
        const dispType=isTransfer?"转账":t.type;
        document.querySelectorAll('#txType input[name=tt]').forEach(r=>{r.checked=(r.value===dispType);});
        $("#txAmt").value=t.amount;
        $("#txAcc").value=t.from;
        $("#txProj").value=t.project||"";
        $("#txOrder").value=t.order||"";
        $("#txCust").value=t.customer||"";
        document.querySelectorAll('#txTag input[name=tg]').forEach(r=>{r.checked=(r.value===t.tag);});
        $("#txNote").value=t.note||"";
        $("#catField").style.display=isTransfer?"none":"block";
        $("#txTransfer").classList.toggle("show",isTransfer);
        renderTxnCatOptions(dispType,isTransfer?"":t.category);
      }
    }else{
      const defType=opts.defaultType||"支出";
      renderTxnCatOptions(defType,opts.defaultType==='收入'?'经营成本回款':undefined);
    }
    renderTxnOrderOptions();showModal();
  }
function editTxn(code){
  const t=M.txns.find(x=>x.code===code);
  if(!t){toast("流水不存在");return;}
  openTxn({editCode:code});
}
function saveTxn(){
  const type=document.querySelector('input[name=tt]:checked').value;
  const amt=parseFloat($("#txAmt").value)||0;if(!amt){toast("请输入金额");return;}
  const tag=document.querySelector('input[name=tg]:checked').value;
  const proj=$("#txProj").value;
  const order=$("#txOrder").value;
  const cust=$("#txCust").value;
  // 关联订单时自动同步关联客户/项目（项目取订单全部，确保各项目收支均能取到）
  let finalProj=proj,finalCust=cust;
  if(order&&!_editingTxnCode){
    const o=M.orders.find(x=>x.code===order);if(o){
      if(!finalCust)finalCust=o.customer||"";
      if(!finalProj)finalProj=_txnProjAll||o.project||"";
      // 同步订单已收款 + 客户应收
      if(type==="收入"){
        o.received=(o.received||0)+amt;
        if(tag==="应收"&&finalCust){const c=M.customers.find(x=>x.code===finalCust);if(c)c.应收=(c.应收||0)+amt;}
      }
    }
  }
  if(_editingTxnCode){
    const t=M.txns.find(x=>x.code===_editingTxnCode);
    if(t){
      t.type=type==="转账"?"支出":type;
      t.amount=amt;
      t.category=type==="转账"?"转账":$("#txCat").value;
      t.from=$("#txAcc").value;
      t.tag=type==="转账"?"正常":tag;
      t.note=$("#txNote").value||(type==="转账"?"A→B 转账":"");
      t.project=finalProj;
      t.order=order;
      t.customer=finalCust;
    }
    _editingTxnCode=null;
    closeModal();toast("已更新流水");
    if(["#/money","#/home","#/biz"].includes(location.hash))render();
    return;
  }
  const seq=String(M.txns.length+1).padStart(4,"0");
  M.txns.push({code:"T20260824"+seq,date:"2026-08-24",type:type==="转账"?"支出":type,amount:amt,category:type==="转账"?"转账":$("#txCat").value,from:$("#txAcc").value,tag:type==="转账"?"正常":tag,note:$("#txNote").value||(type==="转账"?"A→B 转账":"")||"",project:finalProj,order,customer:finalCust});
  closeModal();toast("已保存 · "+type+" "+fmt(amt)+(order?` · 订单 ${order} 已自动收款`:""));
  if(["#/money","#/home","#/biz"].includes(location.hash))render();
}

/* 客户：身份证自动算年龄/性别/生日/地区 */
const REGION={"440305":"广东省深圳市南山区","310115":"上海市浦东新区","330106":"浙江省杭州市西湖区"};
function parseID(id){
  if(!id||id.length<18)return null;
  const y=+id.substr(6,4),m=id.substr(10,2),d=id.substr(12,2);
  const age=2026-y;const gender=(+id[16])%2===1?"男":"女";const birthday=`${y}-${m}-${d}`;
  const region=REGION[id.substr(0,6)]||"未知地区";
  return {age,gender,birthday,region};
}

function editCustomer(code){
  if(!M.customers.find(x=>x.code===code)){toast("客户不存在");return;}
  openCustomer(code);
}
function saveCustomer(){
  const code=$("#cCode").value;
  const name=$("#cName").value.trim();if(!name){toast("请输入姓名");return;}
  const id=$("#cID").value.trim();const r=parseID(id);
  if(code){
    const c=M.customers.find(x=>x.code===code);if(!c)return toast("客户不存在");
    c.name=name;c.contact=$("#cContact").value||"—";c.source=$("#cSource").value;c.type=$("#cType").value;c.id_card=id;
    if(r){c.age=r.age;c.gender=r.gender;c.birthday=r.birthday;c.region=r.region;}
    closeModal();toast("已更新客户 "+name);render();
  }else{
    const newCode="K"+String(M.customers.length+1).padStart(4,"0");
    M.customers.push({code:newCode,name,contact:$("#cContact").value||"—",source:$("#cSource").value,type:$("#cType").value,id_card:id,累计成交:0,应收:0,上次成交:"—",间隔:0,频次:0,projects:[],...(r?{age:r.age,gender:r.gender,birthday:r.birthday,region:r.region}:{})});
    closeModal();toast("已新建客户 "+name+(r?`（${r.age}岁/${r.gender}）`:""));render();
  }
}
function delCustomer(code,fromDetail){
  const c=M.customers.find(x=>x.code===code);if(!c)return toast("客户不存在");
  const refOrders=M.orders.filter(o=>o.customer===code);
  const refTxns=M.txns.filter(t=>t.customer===code);
  let extra="";
  if(refOrders.length)extra+=`\n· 关联 ${refOrders.length} 个订单（删除后引用将清空）`;
  if(refTxns.length)extra+=`\n· 关联 ${refTxns.length} 条资金流水（引用将清空）`;
  confirmModal("删除客户",`确认删除客户「${c.name}」？${extra?'该客户被引用：'+extra:''}`,()=>{
    M.customers=M.customers.filter(x=>x.code!==code);
    refOrders.forEach(o=>{o.customer="";});
    refTxns.forEach(t=>{t.customer="";});
    toast("已删除客户"+(refOrders.length?`（清除了 ${refOrders.length} 个订单的引用）`:""));
    renderBiz();
  });
}

    const body=rows.map((r,i)=>{
      const sub=p=>p.price*r.qty*(r.disc/100);

        <select data-i="${i}" class="oip" style="width:100%;padding:10px 8px;border:1px solid var(--line-strong);border-radius:10px;font-size:13px;background:var(--surface)">${M.products.map(pp=>`<option value="${pp.code}" ${pp.code===r.product?'selected':''}>${pp.name} · ${fmt(pp.price)}</option>`).join("")}</select>
        <input data-i="${i}" class="oipq" type="number" value="${r.qty}" min="1" step="1" style="width:100%;padding:10px 8px;border:1px solid var(--line-strong);border-radius:10px;font-size:13px">
        <input data-i="${i}" class="oipd" type="number" value="${r.disc}" min="0" max="100" step="any" style="width:100%;padding:10px 8px;border:1px solid var(--line-strong);border-radius:10px;font-size:13px">
        <div data-sub="${i}" style="text-align:right;font-weight:700;color:var(--accent-deep);padding:10px 8px">${fmt(rowSub(i))}</div>
        <button class="iconbtn" onclick="delOrderRow(${i})" ${rows.length<=1?'disabled style="opacity:.4;cursor:default"':''}>🗑</button>
      </div>`;
    }).join("");
    box.innerHTML=head+body;
    box.querySelectorAll(".oip").forEach(s=>s.onchange=e=>{rows[+e.target.dataset.i].product=e.target.value;renderRows();renderProj();});
    box.querySelectorAll(".oipq").forEach(s=>s.oninput=e=>{let v=parseInt(e.target.value);if(isNaN(v)||v<1)v=1;rows[+e.target.dataset.i].qty=v;const el=box.querySelector('[data-sub="'+e.target.dataset.i+'"]');if(el)el.textContent=fmt(rowSub(+e.target.dataset.i));recalc();});
    box.querySelectorAll(".oipd").forEach(s=>s.oninput=e=>{let v=parseFloat(e.target.value);if(isNaN(v))v=0;v=Math.max(0,Math.min(100,v));rows[+e.target.dataset.i].disc=v;const el=box.querySelector('[data-sub="'+e.target.dataset.i+'"]');if(el)el.textContent=fmt(rowSub(+e.target.dataset.i));recalc();});
    recalc();renderProj();
  };
  _order={rows,render:renderRows,recalc,editing};
  $("#modal").innerHTML=`
    <h2>${editing?'编辑订单':'新建订单'}</h2>
    <input type="hidden" id="oCode" value="${editing?editing.code:''}">
    <div class="field"><label>客户</label><select id="oCustomer">${M.customers.map(c=>`<option value="${c.code}" ${editing&&editing.customer===c.code?'selected':''}>${c.name}</option>`).join("")}</select></div>
    <div class="field"><label>关联项目 <span style="font-weight:400;color:var(--muted);font-size:11px">根据所选产品自动填充（可跨多项目）</span></label><div id="oProjAuto" class="proj-auto"></div></div>
    <div class="field"><label>产品明细 <span style="font-weight:400;color:var(--muted);font-size:11px">一行一个产品，可添加多行（小计 = 单价 × 数量 × 折扣%，折扣默认 100% 不打折）</span>
      <button class="mini-btn" style="margin-left:8px" onclick="addOrderRow()">+ 添加产品</button></label>
      <div id="oItems"></div></div>
    <div class="field"><label>订单金额（自动计算 = 各产品小计之和）</label><div class="est" id="oEst">¥0</div></div>
    <div class="field"><label>已收款 <span style="font-weight:400;color:var(--muted);font-size:11px">改单不影响历史回款流水；如需调整请到「回款明细」或「资金流水」</span></label><input id="oReceived" type="number" placeholder="0.00" value="${editing?editing.received||0:''}"></div>
    <div class="btn-row"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveOrder()">保存</button></div>`;
  renderRows();
  showModal();
}
function addOrderRow(){if(_order.rows)_order.rows.push({product:M.products[0].code,qty:1,disc:100});_order.render();}
function delOrderRow(i){if(_order.rows&&_order.rows.length>1)_order.rows.splice(i,1);_order.render();}
function saveOrder(){
  if(!_order.rows||!_order.rows.length){toast("请添加产品");return;}
  const items=_order.rows.map(r=>{const p=M.products.find(x=>x.code===r.product)||M.products[0];return{product:p.code,name:p.name,price:p.price,qty:r.qty,disc:r.disc,sub:p.price*r.qty*(r.disc/100)};});
  const amount=items.reduce((s,it)=>s+it.sub,0);
  const received=parseFloat($("#oReceived").value)||0;
  const cust=$("#oCustomer").value;
  const projSet=new Set();_order.rows.forEach(r=>{const p=M.products.find(x=>x.code===r.product);if(p&&p.project)projSet.add(p.project);});
  const proj=[...projSet].join(",");
  const productsTxt=items.map(it=>`${it.name}×${it.qty}${it.disc<100?(' ('+(100-it.disc)+'% off)'):''}`).join("；");
  const editingCode=$("#oCode").value;
  if(editingCode){
    const o=M.orders.find(x=>x.code===editingCode);if(!o){toast("订单不存在");return;}
    o.customer=cust;o.project=proj;o.products=productsTxt;o.items=items;o.amount=amount;
    // 已收款字段：只在差异时提示
    if(Math.abs((o.received||0)-received)>0.01)toast(`订单 ${editingCode} 已收款字段变更不影响历史回款流水`);
    o.received=received;
    // 同步客户关联项目
    const c=M.customers.find(x=>x.code===cust);
    if(c&&proj)proj.split(",").forEach(pc=>{if(!c.projects.includes(pc))c.projects.push(pc);});
    closeModal();toast("已更新订单 "+editingCode);render();
  }else{
    const code="D20260824"+String(M.orders.length+1).padStart(4,"0");
    M.orders.push({code,customer:cust,project:proj,products:productsTxt,items,amount,received,date:"2026-08-24"});
    const c=M.customers.find(x=>x.code===cust);
    if(c&&proj)proj.split(",").forEach(pc=>{if(!c.projects.includes(pc))c.projects.push(pc);});
    closeModal();toast("已新建订单 "+code);render();
  }
}
function editOrder(code){
  if(!M.orders.find(x=>x.code===code)){toast("订单不存在");return;}
  openOrder(code);
}
function delOrder(code,fromDetail){
  const o=M.orders.find(x=>x.code===code);if(!o)return toast("订单不存在");
  const refTxns=M.txns.filter(t=>t.order===code);
  let extra="";
  if(refTxns.length)extra+=`\n· 关联 ${refTxns.length} 条回款流水（将一并删除，账户余额/项目收支同步回滚）`;
  confirmModal("删除订单",`确认删除订单「${o.code}」？金额 ¥${Math.round(o.amount).toLocaleString("zh-CN")}${extra?'\n该订单被引用：'+extra:''}`,()=>{
    // 同步回滚：删除回款流水 + 回滚账户 + 回滚客户应收
    refTxns.forEach(t=>{
      const acc=M.accounts.find(a=>a.code===t.from);
      if(acc)acc.balance-=t.type==="收入"?t.amount:-t.amount;
      const c=M.customers.find(x=>x.code===t.customer);
      if(c&&t.tag==="应收")c.应收=Math.max(0,(c.应收||0)-t.amount);
    });
    M.txns=M.txns.filter(t=>t.order!==code);
    M.orders=M.orders.filter(x=>x.code!==code);
    toast("已删除订单"+(refTxns.length?`（回滚了 ${refTxns.length} 条回款流水）`:""));
    renderBiz();
  });
}
/* 单条删除回款流水 · 同步回滚账户余额、订单已收、客户应收 */
function delReceived(code){
  const t=M.txns.find(x=>x.code===code);if(!t)return toast("回款记录不存在");
  if(!t.order)return toast("该流水未关联订单");
  confirmModal("删除回款",`确认删除该回款记录？金额 ¥${Math.round(t.amount).toLocaleString("zh-CN")}\n将同步回滚账户余额、订单已收、客户应收`,()=>{
    // 回滚账户
    const acc=M.accounts.find(a=>a.code===t.from);
    if(acc)acc.balance-=t.type==="收入"?t.amount:-t.amount;
    // 回滚订单 received
    if(t.order){const o=M.orders.find(x=>x.code===t.order);if(o)o.received=Math.max(0,(o.received||0)-t.amount);}
    // 回滚客户应收
    if(t.tag==="应收"&&t.customer){const c=M.customers.find(x=>x.code===t.customer);if(c)c.应收=Math.max(0,(c.应收||0)-t.amount);}
    M.txns=M.txns.filter(x=>x.code!==code);
    toast("已删除回款记录");renderBiz();
  });
}

/* 订单详情 */
function openOrderDetail(code){
  const o=M.orders.find(x=>x.code===code);if(!o)return;
  const c=M.customers.find(x=>x.code===o.customer);
  const items=o.items||[{name:o.products,price:o.amount,qty:1,disc:0,sub:o.amount}];
  const txns=M.txns.filter(t=>t.order===code);
  const recvd=o.received||0;const due=Math.max(0,o.amount-recvd);
  const rate=o.amount?Math.round(recvd/o.amount*100):0;
  $("#view").innerHTML=`
    <div class="cust-head"><div class="av">📄</div><div><div class="page-title" style="font-size:18px">订单 ${o.code}</div><div class="crumb">${o.date} · 客户 ${c?c.name:'—'}</div></div>
      <div style="margin-left:auto;display:flex;gap:8px"><button class="mini-btn" onclick="editOrder('${o.code}')">✎ 编辑</button><button class="mini-btn" onclick="delOrder('${o.code}',true)">🗑 删除</button><button class="mini-btn" onclick="render()">← 返回经营</button></div></div>
    <div class="grid-2">
      <div class="card"><h3>订单信息</h3><div class="kv">
        <div class="kv-row"><span class="k">客户</span><span class="v">${c?`<span class="clickable" onclick="openCustomerDetail('${c.code}')">${esc(c.name)}</span>`:'—'}</span></div>
        <div class="kv-row"><span class="k">关联项目</span><span class="v">${o.project?projName(o.project):'—'}</span></div>
        <div class="kv-row"><span class="k">订单日期</span><span class="v">${o.date}</span></div>
        <div class="kv-row"><span class="k">订单金额</span><span class="v amount inc">${fmt(o.amount)}</span></div>
        <div class="kv-row"><span class="k">已收款</span><span class="v amount inc">${fmt(recvd)}</span></div>
        <div class="kv-row"><span class="k">待收款</span><span class="v amount ${due>0?'exp':''}">${fmt(due)}</span></div>
        <div class="kv-row"><span class="k">收款进度</span><span class="v">${o.amount?rate+'%':'—'}</span></div>
      </div></div>
      <div class="card"><h3>产品明细（${items.length} 项）</h3>
        <table class="tbl biz-tbl">
          <thead><tr><th>产品</th><th style="text-align:right">单价</th><th style="text-align:right">数量</th><th style="text-align:right">折扣</th><th style="text-align:right">小计</th></tr></thead>
          <tbody>${items.map(it=>`<tr><td data-label="产品">${esc(it.name)}</td><td data-label="单价" style="text-align:right" class="amount">${fmt(it.price)}</td><td data-label="数量" style="text-align:right">${it.qty}</td><td data-label="折扣" style="text-align:right">${it.disc||0}%</td><td data-label="小计" style="text-align:right" class="amount inc">${fmt(it.sub)}</td></tr>`).join("")}</tbody>
        </table>
      </div>
    </div>
    <div class="section-title"><span class="bar"></span>回款流水（${txns.length}）</div>
    <div class="card"><table class="tbl biz-tbl">
      <thead><tr><th>日期</th><th>类型</th><th>标签</th><th>摘要</th><th style="text-align:right">金额</th></tr></thead>
      <tbody>${txns.length?txns.slice().reverse().map(t=>`<tr><td data-label="日期">${t.date.slice(5)}</td><td data-label="类型">${t.type}</td><td data-label="标签"><span class="tag ${t.tag==='正常'?'normal':t.tag==='应收'?'rec':'pay'}">${t.tag}</span></td><td data-label="摘要">${esc(t.note)}</td><td data-label="金额" style="text-align:right" class="amount ${t.type==='收入'?'inc':'exp'}">${t.type==='收入'?'+':'-'}${fmt(t.amount)}</td></tr>`).join(""):'<tr><td colspan="5"><div class="empty">暂无回款记录</div></td></tr>'}</tbody>
    </table></div>`;
}

/* 项目 */
function openProject(){
  $("#modal").innerHTML=`
    <h2>新建项目</h2>
    <div class="field"><label>项目名称</label><input id="pName" placeholder="如：官网改版"></div>
    <div class="field"><label>状态</label><select id="pStatus">${["规划","进行","结束"].map(s=>`<option>${s}</option>`).join("")}</select></div>
    <div class="field"><label>说明</label><textarea id="pDesc" placeholder="项目描述"></textarea></div>
    <div class="field"><label>进度（%）</label><input id="pProgress" type="number" value="0"></div>
    <div class="btn-row"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveProject()">保存</button></div>`;
  showModal();
}
function saveProject(){
  const name=$("#pName").value.trim();if(!name){toast("请输入项目名称");return;}
  const code="P"+String(M.projects.length+1).padStart(4,"0");
  M.projects.push({code,name,status:$("#pStatus").value,desc:$("#pDesc").value||"",progress:parseInt($("#pProgress").value)||0});
  closeModal();toast("已新建项目 "+name);render();
}

/* 带娃：快捷按钮自动记当天时间戳；无参则打开历史登记表单 */
function openBabyModal(type){
  const time=()=>{const n=new Date();return String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0");};
  if(type){
    if(type==="泡奶"){M.baby.push({code:"B20260824"+String(M.baby.length+1).padStart(3,"0"),type:"泡奶",time:time(),volume:150,date:"2026-08-24"});toast("已记录：泡奶 150ml "+time());}
    else{M.baby.push({code:"B20260824"+String(M.baby.length+1).padStart(3,"0"),type:"拉臭臭",time:time(),volume:0,note:"",date:"2026-08-24"});toast("已记录：拉臭臭 "+time());}
    if(["#/baby","#/home"].includes(location.hash))render();
    return;
  }
  const now=time();
  $("#modal").innerHTML=`
    <h2>登记带娃记录</h2>
    <div class="field"><label>日期</label><input id="bDate" type="date" value="2026-08-24"></div>
    <div class="field"><label>类型</label><select id="bType">${["泡奶","拉臭臭"].map(t=>`<option>${t}</option>`).join("")}</select></div>
    <div class="field"><label>时间</label><input id="bTime" type="time" value="${now}"></div>
    <div class="field"><label>奶量（泡奶，ml）</label><input id="bVol" type="number" value="150" min="0"></div>
    <div class="field"><label>备注</label><input id="bNote" placeholder="可选"></div>
    <div class="btn-row"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveBaby()">保存</button></div>`;
  showModal();
}
function saveBaby(){
  const date=$("#bDate").value||"2026-08-24";
  const type=$("#bType").value;
  const t=$("#bTime").value||"00:00";
  const volume=type==="泡奶"?(parseInt($("#bVol").value)||0):0;
  const note=$("#bNote").value.trim();
  const code="B"+date.replace(/-/g,"")+String(M.baby.length+1).padStart(3,"0");
  M.baby.push({code,type,time:t,volume,note,date});
  closeModal();toast("已登记带娃记录 · "+date+" "+t);if(location.hash==="#/baby")render();
}
function delBaby(code){
  const i=M.baby.findIndex(x=>x.code===code);if(i<0)return;
  confirmModal("删除带娃记录","确认删除该带娃记录？",()=>{M.baby.splice(i,1);toast("已删除带娃记录");if(location.hash==="#/baby")render();});
}
function toggleTodo(code){const t=M.todos.find(x=>x.code===code);if(!t)return;t.done=!t.done;render();updateTodoBadge();}

/* 灵感 */
function openIdea(){
  $("#modal").innerHTML=`
    <h2>速记灵感</h2>
    <div class="field"><label>想法</label><textarea id="idText" placeholder="零碎的想法…" style="min-height:90px"></textarea></div>
    <div class="field"><label>关联项目（可选，归档后按项目分类）</label><select id="idProj"><option value="">不挂钩</option>${M.projects.map(p=>`<option value="${p.code}">${p.name}</option>`).join("")}</select></div>
    <div class="btn-row"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveIdea()">保存</button></div>`;
  showModal();
}
function saveIdea(){
  const t=$("#idText").value.trim();if(!t){toast("请输入内容");return;}
  M.ideas.push({code:"I"+String(M.ideas.length+1).padStart(4,"0"),text:t,archived:false,project:$("#idProj").value,archivedAt:""});
  closeModal();toast("已记录灵感");if(location.hash==="#/idea")render();
}
function archiveIdea(code){
  const i=M.ideas.find(x=>x.code===code);if(!i)return;
  i.archived=true;i.archivedAt=nowStamp();

}
function nowStamp(){const n=new Date();const p=x=>String(x).padStart(2,"0");return `2026-08-24 ${p(n.getHours())}:${p(n.getMinutes())}`;}

/* 产品清单 */
function openProduct(){
  $("#modal").innerHTML=`
    <h2>新增产品</h2>
    <div class="field"><label>产品名称</label><input id="prName" placeholder="如：官网改版第三期"></div>
    <div class="field"><label>单价</label><input id="prPrice" type="number" placeholder="0.00"></div>
    <div class="field"><label>关联项目</label><select id="prProj"><option value="">不关联</option>${M.projects.map(p=>`<option value="${p.code}">${p.name}</option>`).join("")}</select></div>
    <div class="btn-row"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveProduct()">保存</button></div>`;
  showModal();
}
function saveProduct(){
  const name=$("#prName").value.trim();const price=parseFloat($("#prPrice").value)||0;
  if(!name){toast("请输入产品名称");return;}
  const code="PR"+String(M.products.length+1).padStart(4,"0");
  M.products.push({code,name,price,project:$("#prProj").value});
  closeModal();toast("已新增产品 "+name);if(location.hash==="#/settings")render();
}
function delProduct(code){
  M.products=M.products.filter(p=>p.code!==code);toast("已删除产品");if(location.hash==="#/settings")render();
}
/* 清空全部业务示例数据（保留账户/参数/产品等配置项） */
function delAllDemo(){
  confirmModal("删除全部示例数据","确认清空全部业务示例数据？\n\n将清空：客户、订单、回款流水、项目、带娃记录、待办、日记、灵感，以及所有账户余额（含期初余额）。\n保留：账户列表、全局参数、产品清单。\n\n此操作不可撤销。",()=>{
    M.customers=[];M.orders=[];M.txns=[];M.projects=[];M.baby=[];M.todos=[];M.diaries=[];M.ideas=[];
    M.accounts.forEach(a=>{a.balance=0;a.opening=0;});
    diarySel="";babyPage=1;babyTodayPage=1;
    toast("已清空全部示例数据");updateTodoBadge();render();
  });
}

/* ============== 导出 / 导入 备份 ============== */
function exportBackup(){
  const data=JSON.stringify(M,null,2);
  const blob=new Blob([data],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download="工作台备份_2026-08-24.json";a.click();
  URL.revokeObjectURL(url);toast("已导出备份文件");
}
function importBackup(file){
  const reader=new FileReader();
  reader.onload=e=>{try{const d=JSON.parse(e.target.result);if(!d.accounts)throw 0;Object.assign(M,d);closeModal();toast("已从备份恢复数据");render();updateTodoBadge();}catch(err){toast("备份文件格式不正确");}};
  reader.readAsText(file);
}
$("#importFile").addEventListener("change",e=>{if(e.target.files[0])importBackup(e.target.files[0]);e.target.value="";});

function updateTodoBadge(){
  const n=M.todos.filter(t=>!t.done).length;
  ["nav-todo","tab-todo"].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=n;});
}

/* ============== Boot ============== */
render();updateTodoBadge();
</script>
